# What the catalogue costs. This file is the truth; stripe is made to agree.
#
#   lighthouse-prices status   what stripe has, and where it differs
#   lighthouse-prices apply    make stripe match, then write billing.yaml
#
# `id` is the plan's name and the stripe lookup key it is held under. The track
# is everything before the last underscore and the billing period is everything
# after it, so `rust_yearly` sells the rust track, yearly. Nothing else has to
# be told which is which.
#
# `books` is what the plan unlocks, by slug — the list is the plan's contents
# and this file is where they are decided. `everything: true` instead, for a
# plan that includes books not written yet; a plan says one or the other, never
# both and never neither.
#
# The slugs are checked against the catalogue when the api boots, so a typo is a
# named startup failure rather than a reader who paid for a book they did not
# get.
#
# `amount` is in minor units — 4900 is $49.00. Changing one is a new stripe
# price with the lookup key transferred onto it, which `apply` does for you.
#
# The billing period is the id's last word. `_yearly` and `_monthly` renew;
# `_lifetime` is `once` at stripe — one payment, and checkout opens in `payment`
# mode rather than `subscription`. Anything else is refused.

currency: usd

plans:
  - id: foundation_yearly
    amount: 4900
    name: Foundation — OS, Networking, DSA
    books:
      - os-fundamentals
      - networking-fundamentals
      - dsa-fundamentals

  - id: foundation_lifetime
    amount: 14900
    name: Foundation, forever
    # What the buy button on this plan's panel says. Absent is "Get Pro".
    button_text: Own it forever
    books:
      - os-fundamentals
      - networking-fundamentals
      - dsa-fundamentals

  # A track's plans usually include the foundation books as well, and say so:
  # there is no inheritance between plans, and a list that leaves them out sells
  # a Go bundle that starts at goroutines.
  - id: go_yearly
    amount: 6900
    name: Go — the Go books and Foundation
    books:
      - os-fundamentals
      - networking-fundamentals
      - dsa-fundamentals
      - go-fundamentals
      - go-intermediate
      - shipping-go-web-services

  - id: all_yearly
    amount: 9900
    name: Everything — every book
    everything: true

  - id: all_lifetime
    amount: 29900
    name: Everything, forever
    everything: true

    # Discounts, if any. The whole section is optional and every declaration
    # written before it existed simply leaves it out.
    #
    # **Declared inside the plan it comes off.** A stripe coupon is restricted
    # to one plan's product, and this is where that restriction is written —
    # there is no list beside the plans saying which ones a tier touches, and so
    # no second place to keep in step with what stripe holds.
    #
    # **One code belongs to one plan.** A coupon is one object with one
    # percentage, so a code declared under two plans is two entries that can
    # disagree about the rate — which is the edit stripe refuses. A tier meant
    # to cover two plans is two codes.
    #
    # `code` is what a reader types at checkout and the coupon's id at stripe,
    # so one name identifies the tier everywhere, and `apply` creates the coupon
    # and the promotion code that points at it.
    #
    # `countries` is ISO 3166-1 alpha-2, uppercase — the shape cloudflare
    # reports, so neither side normalises at request time. A country may be
    # claimed by one tier *of this plan* only: two claims and a reader in it has
    # two coupons off one price and the api is picking, which is a decision
    # nobody wrote down. The same country on another plan's tiers is fine, and
    # is the point — BD can be 70% off this and 40% off the yearly.
    #
    # **There is no catch-all.** A tier naming no countries is refused. A
    # discount offered to everybody is a list price with a discount off it, not
    # purchasing power, and the two are different decisions that should not
    # share a spelling — least of all by way of a list somebody emptied by
    # accident. A country no tier claims is offered nothing, and so is a request
    # cloudflare sent no country header on.
    #
    # **Advertise-only.** Stripe promotion codes carry no country restriction,
    # so what is declared here decides who is *offered* a discount, never who
    # can use one. Enforcing it would mean applying the coupon to the checkout
    # session in rust instead of printing a string, which is a different change.
    #
    # **A percentage cannot be edited once stripe holds it.** Changing a rate
    # means a new code; `apply` refuses the edit rather than deleting and
    # remaking, which would revoke the discount from everybody already on it.
    # `apply` never deletes, so a tier removed from here stops being offered but
    # stays live at stripe until it is deactivated there by hand.
    ppp:
      - code: LIGHTHOUSE-LIFETIME-70
        percent: 70
        countries: [BD, PK, NG]

      - code: LIGHTHOUSE-LIFETIME-40
        percent: 40
        countries: [BR, MX, TR]
