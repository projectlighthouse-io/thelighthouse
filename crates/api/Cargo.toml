[package]
name = "lighthouse-api"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
loginwith = { path = "../loginwith" }
# Takes the money. Knows the provider's wire format and nothing about readers,
# sessions or postgres — `src/billing` owns the rows and the decisions.
billing = { path = "../billing" }
# Reads the content repo: yaml beside markdown, walked from `CONTENT_PATH`. Its
# own crate because two binaries read it — this one serves it,
# `lighthouse-content` writes its metadata into postgres.
#
# `../ohara` is `crates/ohara`, in this repo — cargo resolves a path dependency
# against the manifest's directory, so this is the same kind of in-tree link as
# `loginwith` above. It is *not* the private content repo, which happens to
# share the name and is found at runtime through `CONTENT_PATH`. A clone with no
# access to that repo still builds and tests: `fixture/` is the stand-in.
ohara = { path = "../ohara" }
axum = "0.8"
# `derive` but not `macros` — and they are not the same thing. sqlx defines
# `macros = ["derive", "sqlx-macros/macros"]`, so the narrower half can be taken
# on its own:
#
#   derive  `#[derive(FromRow)]`, which maps a row to a struct by column name.
#           No database involved, at compile time or any other time.
#   macros  `sqlx::query!`, which checks SQL against a live database while
#           compiling. That needs a reachable server or a checked-in .sqlx/
#           cache during `cargo build`, and the docker build has neither.
#
# So the build still works anywhere, and rows still map by name rather than by
# position — a reordered SELECT is then a compile error or a decode error, not
# every field silently shifting by one.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "derive",
    "migrate",
    "chrono",
    "uuid",
] }
# `entitlements.book_id`. The value is minted in the content repo and only read
# here — `ohara` re-exports the type on its structs, but a column bound in this
# crate's own SQL needs it nameable.
uuid = { version = "1", features = ["serde"] }
# Already in the tree — sqlx's `chrono` feature pulls it — but not nameable
# without being declared. Timestamp columns decode as `NaiveDateTime` and are
# formatted here rather than by `to_char` in every query that selects one.
#
# `clock` is not needed: nothing reads the current time through chrono, and
# `NOW()` in a statement is postgres's clock, which is the one that should be
# setting these columns anyway.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The session payload and the oauth cookie's redirect. Both go in a cookie
# value, where a raw `,` or `;` would end the value early.
# Every credential in `Config` is a `SecretString`: `Debug` is `[REDACTED]` and
# the memory is zeroed on drop, so a key added later is redacted without
# anybody remembering to extend a hand-written impl.
secrecy = "0.10"
base64 = "0.22"
# Escaping the failure message into /login?error=... Already in the tree via
# loginwith, so this adds nothing to the build.
form_urlencoded = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
# The fake content repo, which is `cfg(test)`-invisible across a crate boundary
# and so arrives as a feature. Dev-only: the fixture is not in the release
# binary.
ohara = { path = "../ohara", features = ["testing"] }
# Drives the real router in-process, so the route tests exercise the mounting
# and the layers rather than calling the handlers directly and proving nothing
# about where they are reachable from.
tower = { version = "0.5", features = ["util"] }
