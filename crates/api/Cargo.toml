[package]
name = "lighthouse-api"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
loginwith = { path = "../loginwith" }
axum = "0.8"
# No `macros` feature on purpose. `sqlx::query!` checks SQL against a live
# database at compile time, which means either a reachable server or a checked-in
# .sqlx/ cache during `cargo build` — and the docker build has neither. The
# runtime API costs the compile-time check and buys a build that works anywhere.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "migrate",
    "chrono",
    "uuid",
] }
# The session payload and the oauth cookie's redirect. Both go in a cookie
# value, where a raw `,` or `;` would end the value early.
base64 = "0.22"
# Escaping the failure message into /login?error=... Already in the tree via
# loginwith, so this adds nothing to the build.
form_urlencoded = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
# Drives the real router in-process, so the route tests exercise the mounting
# and the layers rather than calling the handlers directly and proving nothing
# about where they are reachable from.
tower = { version = "0.5", features = ["util"] }
