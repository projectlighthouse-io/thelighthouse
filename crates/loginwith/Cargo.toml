[package]
name = "loginwith"
version = "0.1.0"
edition = "2024"
description = "OAuth2 authorization-code login for GitHub and Google. Socialite's two providers, nothing else."
readme = "README.md"

[lints]
workspace = true

[dependencies]
# webpki roots rather than the system store: the runtime image is alpine and
# would otherwise need ca-certificates installed for TLS to work at all.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "http2",
    "charset",
    "rustls-tls-webpki-roots",
] }
serde = { version = "1", features = ["derive"] }
form_urlencoded = "1"
# std, so its error type implements std::error::Error and can be a `#[source]`.
getrandom = { version = "0.3", features = ["std"] }
subtle = "2"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
# A real local HTTP server, so the flow tests assert the requests that go out
# rather than trusting that they are built correctly. Socialite asserts the same
# things against a mocked Guzzle client.
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
