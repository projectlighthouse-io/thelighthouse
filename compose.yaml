# The two pieces of local development that are not the code you are editing:
# postgres, and the caddy that sits in front of it all.
#
# The api and nuxt are deliberately absent. You run those yourself, from source,
# with a compiler and a watcher attached — putting them here would mean a second
# definition of how they start, drifting from the Dockerfile that actually ships.
# `make image && make run` runs the real thing.
#
# Caddy *is* here, because the alternative was worse. Without it, development was
# browser → nuxt with a devProxy forwarding /api, while production is
# browser → caddy → nuxt + api. The session cookie crossed different boundaries
# in each, which is exactly where cookie bugs hide and exactly the bug you cannot
# reproduce locally. Same Caddyfile, same routing rules, same origin for both
# processes — only the upstreams differ.

services:
  postgres:
    # Alpine, and pinned to the major the production dump came from (17.10).
    # A dump restored into an older major fails outright; a newer one accepts it
    # and then differs in ways nobody looks for until something breaks.
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lighthouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lighthouse}
      POSTGRES_DB: ${POSTGRES_DB:-lighthouse}

    ports:
      # 5433 on the host, not 5432. The laravel stack publishes 5432, and the
      # rebuild is developed alongside it — same port means whichever came up
      # first wins and the other fails to bind, which reads as a broken
      # database rather than a port collision. Inside the container it is still
      # 5432, so DATABASE_URL points at 5433 from the host.
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      # Named, so `docker compose down` keeps the data and `down -v` is the
      # deliberate way to throw it away.
      - lighthouse-postgres:/var/lib/postgresql/data

    healthcheck:
      # `pg_isready` alone reports ready during the brief first-boot restart
      # postgres does after initdb, so the check names the database too.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lighthouse} -d ${POSTGRES_DB:-lighthouse}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine

    ports:
      # 8000 on the host, matching APP_URL and the callback URLs already
      # registered with Google and GitHub. Inside, caddy binds 8080 exactly as it
      # does in the production image.
      - "${CADDY_PORT:-8000}:8080"

    environment:
      # The api and nuxt run on the host, not in this network. In the production
      # image these default to loopback and nothing sets them.
      API_UPSTREAM: host.docker.internal:9000
      NUXT_UPSTREAM: host.docker.internal:3000

    volumes:
      # Read-only: the container has no business editing the routing rules, and
      # the same file is what ships in the image.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

    extra_hosts:
      # Docker Desktop resolves this already; declaring it keeps the compose file
      # working on plain docker engine, where it is not automatic.
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

volumes:
  lighthouse-postgres:
